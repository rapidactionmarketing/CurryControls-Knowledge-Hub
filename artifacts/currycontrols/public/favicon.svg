<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CurryControls.com">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0A2342"/>
  <rect width="64" height="64" rx="12" fill="url(#grid)"/>
  <!-- C monogram: a heavy arc open to the right -->
  <path d="M43 21.1A17 17 0 1 0 43 42.9" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round"/>
  <!-- One control pulse leaving the controller through the opening of the C -->
  <path d="M26 34h8v-8h9v8h9" fill="none" stroke="#5FA8E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
